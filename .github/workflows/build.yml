name: Build APK

# Builds the app on GitHub's computers after every push to main,
# then posts the APK under Releases so anyone can download it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Remove spaces, line breaks and a pasted label, which copying on Windows can add.
          printf '%s' "$KEYSTORE_BASE64" | sed 's/KEYSTORE_BASE64//g' | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check the signing key and password
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PW=$(printf '%s' "$SIGNING_STORE_PASSWORD" | tr -d ' \r\n\t')
          # Fingerprints only (never the secret values), to tell which secret was pasted wrong.
          echo "key file: $(wc -c < "$SIGNING_STORE_FILE") bytes, sha256 $(sha256sum "$SIGNING_STORE_FILE" | cut -c1-16)"
          echo "password: ${#PW} characters, sha256 $(printf '%s' "$PW" | sha256sum | cut -c1-16)"
          if ! keytool -list -keystore "$SIGNING_STORE_FILE" -storepass "$PW" > /dev/null 2>&1; then
            echo "::error::The key or KEYSTORE_PASSWORD secret doesn't match. Paste both again from github-secrets.txt."
            exit 1
          fi
          echo "SIGNING_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$(printf '%s' "${{ secrets.KEY_ALIAS }}" | tr -d ' \r\n\t')" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Gallery-build-${{ github.run_number }}.apk"

      - name: Post it under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gallery build ${{ github.run_number }}
          body: |
            Download **Gallery-build-${{ github.run_number }}.apk** below and open it on your Android phone.
            Installs over earlier builds and keeps your favorites and trash.
          files: Gallery-build-${{ github.run_number }}.apk
          make_latest: true
